name: Android release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cursor/android-release-apk-948c

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-35" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          flutter config --no-analytics
          flutter config --android-sdk "$SDK"

      - name: Fit Gradle heap to the runner
        run: |
          set -euo pipefail
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError/' android/gradle.properties
          grep -q '^org.gradle.workers.max=' android/gradle.properties || echo 'org.gradle.workers.max=2' >> android/gradle.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the release file
        run: cp build/app/outputs/flutter-apk/app-release.apk secret-android-1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.0
          name: Секрет 1.0.0 для Android
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Файл для установки на телефон: secret-android-1.0.0.apk
            Адрес сервера уже внутри: http://85.113.129.93:3000.

            У каждого телефона будет свой код вида `456 N 634`. Этот код вводят на втором устройстве через +.
          files: secret-android-1.0.0.apk
